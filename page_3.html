<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk - HMI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* Tetap simpan ini agar gambar seragam ukurannya */
        .product-img {
            height: 200px;
            object-fit: cover;
        }
        
        /* Bagian .card dan .card:hover sudah dihapus */
    </style>
</head>
<body class="bg-light">

    <div id="header-shared"></div>

    <header class="container py-5 text-center">
        <h1 class="fw-bold">KATALOG PRODUK</h1>
        <p class="text-muted mx-auto" style="max-width: 700px;">
            Eksplorasi berbagai hasil karya, penelitian, dan produk kreatif karya Mahasiswa serta Dosen HMI Universitas Ma Chung.
        </p>
    </header>

    <main class="container mb-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <img src="img/produk1.jpg" class="card-img-top product-img" alt="Produk 1">
                    <div class="card-body">
                        <h5 class="fw-bold">PRODUK INOVASI 1</h5>
                        <p class="card-text text-muted small">Berikut adalah produk yang dapat dilihat, silahkan pilih produk yang kalian ingin lihat untuk informasi lebih detail.</p>
                        <a href="page_4.html" class="btn btn-dark btn-sm w-100">CEK DETAILS</a>
                    </div>
                </div>
            </div>
            </div>
    </main>

    <div id="footer-shared"></div>

    <script>
        $(function(){
            $("#header-shared").load("header.html");
            $("#footer-shared").load("footer.html");
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
